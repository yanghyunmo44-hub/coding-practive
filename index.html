<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비밀번호 유출 확인</title>
  <link href='style.css' rel='stylesheet'>
</head>
<body>
  <button id="theme-toggle" class="theme-toggle">🌓 테마 변경</button>

  <div class="ad-placeholder" id="top-ad">광고 영역 (상단)</div>

  <main>
    <h1>비밀번호가 유출되었나요?</h1>
    <p>아래에 비밀번호를 입력하여 데이터 유출 사고에 포함되었는지 확인하세요.</p>
    <form id="password-checker-form">
      <input type="password" id="password-input" placeholder="비밀번호를 입력하세요" required>
      <button type="submit">확인하기</button>
    </form>
    <p class="security-notice">🔒 입력하신 비밀번호는 절대 전송되지 않으며, 모든 확인 과정은 브라우저 내에서 안전하게 처리됩니다.</p>
    <div id="result-container"></div>
  </main>
  <section class="partnership-section"> 
    <h2>🤝 제휴 문의</h2> 
    <form id="partnership-form" action="https://formspree.io/f/mjglbzer" method="POST"> 
      <div class="form-group"> 
        <label for="name">이름/기업명</label> 
        <input type="text" id="name" name="name" placeholder="성함 또는 기업명을 입력하세요" required> 
      </div> 
      <div class="form-group"> 
        <label for="email">이메일 주소</label> 
        <input type="email" id="email" name="_replyto" placeholder="연락받으실 이메일을 입력하세요" required> 
      </div> 
      <div class="form-group"> 
        <label for="message">문의 내용</label> 
        <textarea id="message" name="message" placeholder="제휴 관련 내용을 상세히 적어주세요" required></textarea> 
      </div> 
      <button type="submit" class="submit-btn">문의 보내기</button> 
    </form> 
  </section>
  <section class="comments-section"> 
    <h2>💬 댓글</h2> 
    <div id="disqus_thread"></div> 
  </section>

  <div class="ad-placeholder" id="bottom-ad">광고 영역 (하단)</div>

  <script defer type="text/javascript" src="main.js"></script>
</body>
</html>
