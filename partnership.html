<body class="sub-page">
  <header>
    <nav>
      <a href="index.html" class="logo">🛡️ SafeCheck</a>
      <ul class="nav-links">
        <li><a href="index.html#checker">도구</a></li>

        <li><button id="theme-toggle" class="theme-toggle">🌓 테마 변경</button></li>
      </ul>
    </nav>
  </header>

  <div class="container">
    <div class="ad-placeholder">광고 영역 (상단 배너)</div>

    <section class="partnership-section" id="contact">
      <h2>🤝 제휴 및 비즈니스 문의</h2>
      <p class="lead" style="text-align: center; margin-bottom: 2rem;">SafeCheck와 함께 보안 생태계를 넓혀갈 파트너를 찾습니다.</p>
      
      <form id="partnership-form" action="https://formspree.io/f/mjglbzer" method="POST">
        <div class="form-group">
          <label for="name">성함 또는 기업명</label>
          <input type="text" id="name" name="name" placeholder="문의하시는 분의 성함을 입력하세요" required>
        </div>
        <div class="form-group">
          <label for="email">회신받을 이메일</label>
          <input type="email" id="email" name="_replyto" placeholder="example@email.com" required>
        </div>
        <div class="form-group">
          <label for="message">문의 상세 내용</label>
          <textarea id="message" name="message" placeholder="제휴 제안이나 기술 문의 내용을 상세히 적어주세요" required style="min-height: 200px;"></textarea>
        </div>
        <button type="submit" class="submit-btn" style="width: 100%; margin-top: 1rem;">제휴 문의 보내기</button>
      </form>
    </section>

    <div class="ad-placeholder">광고 영역 (하단 배너)</div>
  </div>

  <footer>
    <div class="footer-content">
      <div class="footer-section">
        <h4>SafeCheck</h4>
